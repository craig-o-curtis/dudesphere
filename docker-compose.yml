# Every port below is bound to 127.0.0.1, so only this machine can reach it.
# Without the address, Docker listens on every network the machine is on, and
# anyone on the same Wi-Fi could try these logins.
services:
  postgres:
    image: postgres:18-alpine
    container_name: dude-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER}
      POSTGRES_PASSWORD: ${PG_ADMIN_PW}
      POSTGRES_DB: ${PG_DATABASE}
      # The server's own zone and the default zone of every session. UTC is
      # already this image's default; stating it here means a change of image
      # cannot move the database clock without someone noticing.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ADMIN_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8
    container_name: dude-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MG_ADMIN_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MG_ADMIN_PW}
      MONGO_INITDB_DATABASE: dude-abidings
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dude-pgadmin
    restart: unless-stopped
    environment:
      # The pgAdmin login. Read from .env, like every other credential here,
      # so no address is written in this file. It is the same EMAIL the seed
      # uses for the app's admin. pgAdmin will not start while it is empty.
      PGADMIN_DEFAULT_EMAIL: ${EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_ADMIN_PW}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  mongo-express:
    image: mongo-express:latest
    container_name: dude-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MG_ADMIN_USER}:${MG_ADMIN_PW}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MG_ADMIN_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MG_ADMIN_PW}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - mongo

  # Catches every email the app sends and delivers none. Read them in the
  # web inbox at http://localhost:8025. The app sends to it by default: see
  # MAIL_HOST and MAIL_PORT in .env.example. Nothing is kept across a restart.
  mailpit:
    image: axllent/mailpit:latest
    container_name: dude-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP, where the app sends
      - "127.0.0.1:8025:8025" # the web inbox

volumes:
  postgres_data:
  mongo_data:
