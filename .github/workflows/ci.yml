name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch/PR cancels the run that's still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code
permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, and the API's typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # The workspace packages the API imports, built first so it can read them.
      - name: Build the API's workspace packages
        run: pnpm --filter "@dudesphere/api^..." run build
      - run: pnpm --filter "@dudesphere/api..." run typecheck
      - run: pnpm --filter "@dudesphere/api..." run test
      - run: pnpm --filter "@dudesphere/api..." run build

  web:
    name: Web app typecheck, test, build
    runs-on: ubuntu-latest
    # The Next.js build reads no database and no API: every page that calls
    # the API reads it at request time, inside a Suspense boundary.
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Next's own build cache, so an unchanged page is not compiled again.
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build the web app's workspace packages
        run: pnpm --filter "@dudesphere/web^..." run build
      - run: pnpm --filter @dudesphere/web run typecheck
      - run: pnpm --filter @dudesphere/web run test
      - run: pnpm --filter @dudesphere/web run build

  migrations:
    name: Migrations apply, match entities, and roll back
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine # same image as docker-compose.yml
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dudesphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Read by apps/api/src/database/data-source.ts. A throwaway database, so no secrets needed.
    env:
      PG_HOST: localhost
      PG_PORT: 5432
      PG_ADMIN_USER: ci
      PG_ADMIN_PW: ci
      PG_DATABASE: dudesphere_ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the API's workspace packages
        run: pnpm --filter "@dudesphere/api^..." run build
      - name: Apply all migrations to an empty database
        run: pnpm --filter @dudesphere/api migration:run
      - name: Entities match the migrated schema
        run: pnpm --filter @dudesphere/api migration:check
      - name: Newest migration can be rolled back
        run: pnpm --filter @dudesphere/api migration:revert
      - name: ...and re-applied
        run: pnpm --filter @dudesphere/api migration:run
      - name: Entities still match
        run: pnpm --filter @dudesphere/api migration:check

  e2e:
    name: End-to-end against live databases
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine # same image as docker-compose.yml
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dudesphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8 # same image as docker-compose.yml
        # No auth: a throwaway database that only this job can reach, so
        # MONGO_URI below needs no authSource, unlike the local .env.
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Throwaway databases, so none of this is secret. The two Observe values
    # are required by apps/api/src/config/env.validate.ts, so the app will not start
    # without them.
    env:
      PG_HOST: localhost
      PG_PORT: 5432
      PG_ADMIN_USER: ci
      PG_ADMIN_PW: ci
      PG_DATABASE: dudesphere_ci
      MONGO_URI: mongodb://localhost:27017/dude-abidings
      # Not a secret: it signs tokens only inside this job. It is this long
      # because the app will not start with fewer than 32 characters.
      JWT_SECRET: ci-only-not-a-real-secret-just-long-enough
      EMAIL: ci-admin@example.com
      PASSWORD: ci-admin-password
      DUDE_OBSERVE_APP_KEY: ci
      DUDE_OBSERVE_APP_SECRET: ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the API's workspace packages
        run: pnpm --filter "@dudesphere/api^..." run build
      - name: Create the schema
        run: pnpm --filter @dudesphere/api migration:run
      # No e2e suite needs the admin: each makes its own users. This step is
      # here to prove that the seed script still starts and runs.
      - name: Seed the admin user
        run: pnpm --filter @dudesphere/api seed:run
      - run: pnpm --filter @dudesphere/api test:e2e
